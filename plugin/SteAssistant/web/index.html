<div class="app" id="app" data-drawer="">
  <!-- Рамка: боковая панель и узкая шапка на телефоне. Работа — на белом листе справа. -->
  <header class="mbar">
    <button class="iconbtn" type="button" data-act="drawer" data-v="side" aria-label="Меню и детали"><svg class="ico"><use href="#i-menu"/></svg></button>
    <span class="mbar-title" id="mbarTitle">STE Assistant</span>
    <button class="iconbtn only-chat" type="button" data-act="drawer" data-v="pass" aria-label="Паспорт печати"><svg class="ico"><use href="#i-panel"/></svg></button>
  </header>
  <aside class="side" id="sideFrame" aria-label="Навигация">
    <div class="brandrow">
      <a class="brandmark" href="#chat" data-act="view" data-v="chat">
        <i class="orb mark" aria-hidden="true"></i>
        <span><b>STE Assistant</b><small id="scope">ассистент печати 3D/5D</small></span>
      </a>
      <button class="iconbtn closeside" type="button" data-act="drawer" data-v="side" aria-label="Закрыть меню"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <nav class="nav" aria-label="Разделы">
      <button type="button" data-act="view" data-v="chat"><svg class="ico"><use href="#i-chat"/></svg><span>Чат</span></button>
      <button type="button" data-act="view" data-v="catalog"><svg class="ico"><use href="#i-archive"/></svg><span>Картотека</span></button>
      <button type="button" data-act="view" data-v="settings"><svg class="ico"><use href="#i-gear"/></svg><span>Настройки</span></button>
    </nav>
    <div class="side-parts" id="side"></div>
    <div class="side-foot">
      <div class="status" id="status"></div>
      <button class="iconbtn" type="button" data-act="theme" id="themeBtn" aria-label="Сменить тему" title="Сменить тему"><svg class="ico"><use href="#i-moon"/></svg></button>
    </div>
    <div class="side-resize" id="sideResize" role="separator" aria-orientation="vertical" aria-label="Ширина панели — перетащите или стрелки; двойной щелчок вернёт обычную" aria-valuemin="180" aria-valuemax="440" tabindex="0" title="Перетащите, чтобы изменить ширину"></div>
  </aside>

  <div class="sheet">
    <section class="view chat-layout" id="view-chat">
      <main class="chat">
        <div class="chat-head" id="chatHead"></div>
        <div class="feed" id="feed"><div class="feed-in" id="feedIn"></div></div>
        <div class="composer-wrap">
          <div class="composer-in">
            <div class="suggest" id="suggest"></div>
            <form class="composer" id="composer" autocomplete="off">
              <div class="rv-mode" id="rvMode" hidden><svg class="ico sm"><use href="#i-camera"/></svg><span>Разбор печати по фото: приложите фото напечатанной детали — найду дефекты и предложу исправления.</span>
                <button type="button" class="iconbtn sm" data-act="review-off" aria-label="Выйти из разбора" title="Выйти из разбора"><svg class="ico sm"><use href="#i-x"/></svg></button></div>
              <div class="pend" id="pending" hidden></div>
              <div class="crow">
                <button class="attach" type="button" data-act="attach" aria-label="Приложить файл" title="STL, OBJ, 3MF, DOCX, TXT, JPG, PNG"><svg class="ico"><use href="#i-clip"/></svg></button>
                <input type="file" id="fileIn" multiple hidden accept=".stl,.obj,.3mf,.docx,.txt,.jpg,.jpeg,.png">
                <label class="sr" for="msg">Сообщение ассистенту</label>
                <textarea id="msg" rows="1" placeholder="Опишите деталь, приложите модель и ТЗ…"></textarea>
                <span id="sendSlot"></span>
              </div>
            </form>
          </div>
        </div>
      </main>
      <aside class="pass" id="pass" aria-label="Паспорт печати"></aside>
    </section>
    <section class="view page" id="view-catalog" hidden></section>
    <section class="view page" id="view-settings" hidden></section>
  </div>
  <div class="scrim" id="scrim" hidden data-act="close"></div>
  <div id="overlay"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
